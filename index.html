<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aceptar Cookies</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        .container {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* === IMAGEN DE FONDO === */
        /* Reemplaza la URL por la imagen que quieras usar */
        .bg-image {
            position: absolute;
            inset: 0;
            background-image: url('imagen.jpg');
            background-size: cover;
            background-position: center;
            z-index: 0;
        }

        .card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(14px);
            border-radius: 18px;
            padding: 42px 36px;
            max-width: 440px;
            width: 90%;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.25);
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 20px;
            background: #0f3460;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            box-shadow: 0 4px 12px rgba(15, 52, 96, 0.3);
        }

        .card h2 {
            margin: 0 0 12px 0;
            font-size: 22px;
            font-weight: 700;
            color: #1a1a2e;
            letter-spacing: -0.3px;
        }

        .card p {
            margin: 0 0 28px 0;
            font-size: 14.5px;
            line-height: 1.65;
            color: #4a4a5a;
        }

        .btn-accept {
            background: #0f3460;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: all 0.25s ease;
            box-shadow: 0 4px 16px rgba(15, 52, 96, 0.4);
            letter-spacing: 0.3px;
        }

        .btn-accept:hover {
            background: #0a2648;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(15, 52, 96, 0.5);
        }

        .btn-accept:active {
            transform: translateY(0);
        }

        .links {
            margin-top: 16px;
            font-size: 11.5px;
            color: #888;
        }

        .links a {
            color: #0f3460;
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        .links a:hover {
            opacity: 0.7;
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .card {
                padding: 32px 24px;
                border-radius: 14px;
            }
            .card h2 {
                font-size: 20px;
            }
        }
    </style>
<base target="_blank">
</head>
<body>
    <div class="container">
        <div class="bg-image"></div>

        <div class="card">
            <div class="icon">🌐</div>
            <h2>Aceptar Cookies</h2>
            <p>
                Este sitio web utiliza cookies para mejorar tu experiencia de navegación, analizar el tráfico y personalizar el contenido. Al hacer clic en "Aceptar", consientes el uso de todas las cookies.
            </p>
            <button class="btn-accept" onclick="acceptCookies()">
                Aceptar
            </button>
            <div class="links">
            </div>
        </div>
    </div>

    <script>

        const DESTINO = '';

        function acceptCookies() {
            localStorage.setItem('cookiesAccepted', 'true');
            window.location.href = DESTINO;
        }
    </script>
</body>
</html>
